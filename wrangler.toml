account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"

name = "qtodev-site"
main = ".open-next/worker.js"
compatibility_date = "2025-06-29"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Self-reference service binding; service name must match worker name.
# https://opennext.js.org/cloudflare/caching
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "qtodev-site"

# Image optimization: https://opennext.js.org/cloudflare/howtos/image
[images]
binding = "IMAGES"

# Nightly token cleanup — fires at 03:00 UTC and calls GET /api/cron/cleanup-tokens
# via an external cron service (e.g. Upstash QStash or EasyCron) with:
#   Authorization: Bearer <CRON_SECRET>
# Cloudflare scheduled events require a custom `scheduled` handler; until opennextjs-cloudflare
# exposes one, use an external HTTP trigger pointed at your deployed worker URL.
[triggers]
crons = ["0 3 * * *"]

# PostgreSQL via Hyperdrive (Workers runtime). Create config and set `id`:
#   ./scripts/create-hyperdrive.sh --host YOUR_PUBLIC_DB_HOST --user postgres --database qtodev
# Origin must be publicly reachable (not localhost / 192.168.x.x). See README.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"
localConnectionString = "postgresql://postgres:postgres@localhost:5432/qtodev"
