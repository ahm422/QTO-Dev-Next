account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"

name = "qto-dev-next"
main = ".open-next/worker.js"
compatibility_date = "2025-12-30"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[alias]
sqlite = "./scripts/workerd-sqlite-shim.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Self-reference service binding; service name must match worker `name` above.
# https://opennext.js.org/cloudflare/caching
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "qto-dev-next"

# Image optimization: https://opennext.js.org/cloudflare/howtos/image
[images]
binding = "IMAGES"

# Email Sending uses the EMAIL binding below (no API key). From-address must be @qtodev.com.
# Declared here, not in the dashboard: `wrangler deploy` replaces plaintext vars with this
# config, so dashboard-only vars are dropped on the next deploy (secrets are preserved).
[vars]
EMAIL_FROM = "noreply@qtodev.com"
EMAIL_ADMIN_TO = "admin@example.com"

#
# Nightly token cleanup — fires at 03:00 UTC and calls GET /api/cron/cleanup-tokens
# via an external cron service (e.g. Upstash QStash or EasyCron) with:
#   Authorization: Bearer <CRON_SECRET>
# Cloudflare scheduled events require a custom `scheduled` handler; until opennextjs-cloudflare
# exposes one, use an external HTTP trigger pointed at your deployed worker URL.
[triggers]
crons = ["0 3 * * *"]

[[send_email]]
name = "EMAIL"

# D1 (Workers runtime). Apply schema: wrangler d1 migrations apply qtodev-d1 --remote
# Local dev: wrangler d1 migrations apply qtodev-d1 --local
[[d1_databases]]
binding = "DB"
database_name = "qtodev-d1"
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "./migrations/d1"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "qtodev-media"

# Staging environment — separate D1 for Phase 4/6 migration dry-runs (not production).
# Create: npx wrangler d1 create qtodev-d1-staging
# Replace database_id below with output from create command.
# Apply:  npx wrangler d1 migrations apply qtodev-d1-staging --remote --env staging
[env.staging]
name = "qtodev-site-staging"

[env.staging.vars]
EMAIL_FROM = "staging@qtodev.com"
EMAIL_ADMIN_TO = "admin@example.com"

[[env.staging.services]]
binding = "WORKER_SELF_REFERENCE"
service = "qtodev-site-staging"

[env.staging.images]
binding = "IMAGES"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "qtodev-d1-staging"
database_id = "YOUR_STAGING_D1_DATABASE_ID"
migrations_dir = "./migrations/d1"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "qtodev-media"

[[env.staging.send_email]]
name = "EMAIL"
