<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="meeting-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="meeting-board" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="meeting-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f48b22"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="meeting-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#meeting-bg)"/>
  <!-- Whiteboard -->
  <rect x="80" y="80" width="480" height="280" rx="12" fill="url(#meeting-board)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="100" y="100" width="440" height="240" rx="8" fill="#ffffff"/>
  <!-- Whiteboard content: diagram -->
  <rect x="120" y="120" width="100" height="60" rx="6" fill="#f48b22" opacity="0.9"/>
  <rect x="120" y="190" width="100" height="50" rx="6" fill="#fde68a" opacity="0.9"/>
  <rect x="240" y="140" width="100" height="60" rx="6" fill="#93c5fd" opacity="0.9"/>
  <rect x="240" y="210" width="100" height="50" rx="6" fill="#a7f3d0" opacity="0.9"/>
  <rect x="360" y="120" width="100" height="60" rx="6" fill="#c4b5fd" opacity="0.9"/>
  <rect x="360" y="190" width="100" height="50" rx="6" fill="#f9a8d4" opacity="0.7"/>
  <path d="M220 150 L240 150" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M220 220 L240 220" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M340 150 L360 150" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M340 220 L360 220" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="400" y="280" fill="#64748b" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">Strategy → Design → Build</text>
  <!-- Person silhouettes (simple) -->
  <ellipse cx="180" cy="420" rx="50" ry="18" fill="#334155"/>
  <circle cx="180" cy="380" r="35" fill="#475569"/>
  <rect x="155" y="415" width="50" height="60" rx="8" fill="#475569"/>
  <ellipse cx="400" cy="440" rx="55" ry="20" fill="#334155"/>
  <circle cx="400" cy="395" r="40" fill="#64748b"/>
  <rect x="370" y="435" width="60" height="65" rx="8" fill="#64748b"/>
  <ellipse cx="620" cy="430" rx="52" ry="19" fill="#334155"/>
  <circle cx="620" cy="382" r="38" fill="#475569"/>
  <rect x="588" y="425" width="64" height="62" rx="8" fill="#475569"/>
  <!-- Laptop glow -->
  <rect x="320" y="380" width="160" height="100" rx="8" fill="#0f172a" stroke="#f48b22" stroke-width="2" opacity="0.9"/>
  <rect x="330" y="390" width="140" height="75" rx="4" fill="#1e293b"/>
  <rect x="340" y="400" width="50" height="6" rx="2" fill="#f48b22"/>
  <rect x="340" y="412" width="120" height="4" rx="2" fill="#475569"/>
  <rect x="340" y="420" width="90" height="4" rx="2" fill="#475569"/>
  <!-- Accent corner -->
  <circle cx="700" cy="120" r="70" fill="url(#meeting-accent)" opacity="0.2"/>
  <circle cx="700" cy="120" r="40" fill="url(#meeting-accent)" opacity="0.35"/>
  <path d="M682 120 L700 98 L718 120 L700 142 Z" fill="#f48b22"/>
</svg>
