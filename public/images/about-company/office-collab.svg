<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="office-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3e7"/>
      <stop offset="100%" stop-color="#fde8d4"/>
    </linearGradient>
    <linearGradient id="office-desk" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="office-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>
    <linearGradient id="office-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f48b22"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="office-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#office-bg)"/>
  <!-- Window / light strip -->
  <rect x="80" y="60" width="640" height="120" rx="8" fill="rgba(255,255,255,0.6)"/>
  <rect x="100" y="80" width="200" height="80" rx="4" fill="#93c5fd"/>
  <rect x="320" y="80" width="180" height="80" rx="4" fill="#a7f3d0"/>
  <rect x="520" y="80" width="180" height="80" rx="4" fill="#fde68a"/>
  <!-- Desk -->
  <path d="M0 420 L800 420 L780 600 L20 600 Z" fill="url(#office-desk)" filter="url(#office-shadow)"/>
  <!-- Monitor 1 -->
  <rect x="120" y="200" width="220" height="140" rx="8" fill="url(#office-screen)"/>
  <rect x="130" y="210" width="200" height="100" rx="4" fill="#1e293b"/>
  <rect x="145" y="225" width="60" height="8" rx="2" fill="#334155"/>
  <rect x="145" y="245" width="120" height="6" rx="2" fill="#334155"/>
  <rect x="145" y="258" width="100" height="6" rx="2" fill="#334155"/>
  <rect x="220" y="335" width="20" height="25" fill="#4b5563"/>
  <rect x="100" y="358" width="260" height="12" rx="2" fill="#6b7280"/>
  <!-- Monitor 2 with code -->
  <rect x="380" y="180" width="240" height="160" rx="8" fill="url(#office-screen)"/>
  <rect x="390" y="190" width="220" height="140" rx="4" fill="#0f172a"/>
  <rect x="405" y="205" width="40" height="6" rx="2" fill="#f48b22"/>
  <rect x="405" y="218" width="120" height="5" rx="2" fill="#64748b"/>
  <rect x="405" y="228" width="80" height="5" rx="2" fill="#94a3b8"/>
  <rect x="405" y="238" width="100" height="5" rx="2" fill="#64748b"/>
  <rect x="405" y="248" width="60" height="5" rx="2" fill="#f48b22"/>
  <rect x="405" y="258" width="140" height="5" rx="2" fill="#94a3b8"/>
  <rect x="490" y="335" width="20" height="25" fill="#4b5563"/>
  <rect x="370" y="358" width="260" height="12" rx="2" fill="#6b7280"/>
  <!-- Plant -->
  <ellipse cx="640" cy="400" rx="50" ry="18" fill="#374151"/>
  <path d="M640 382 Q620 320 640 260 Q660 320 640 382" fill="#22c55e"/>
  <path d="M625 350 Q615 300 625 260" stroke="#15803d" stroke-width="4" fill="none"/>
  <path d="M655 340 Q665 290 655 250" stroke="#15803d" stroke-width="4" fill="none"/>
  <!-- Coffee cup -->
  <path d="M700 350 L710 350 L712 400 Q710 420 695 420 Q680 420 678 400 L680 350 Z" fill="#fef3e7" stroke="#f48b22" stroke-width="2"/>
  <ellipse cx="705" cy="350" rx="8" ry="4" fill="#fde8d4"/>
  <!-- Accent elements -->
  <circle cx="720" cy="260" r="45" fill="url(#office-accent)" opacity="0.25"/>
  <circle cx="720" cy="260" r="28" fill="url(#office-accent)" opacity="0.4"/>
  <path d="M705 260 L720 245 L735 260 L720 275 Z" fill="#f48b22"/>
</svg>
